name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-test:
    name: Restore, build, test and validate canonical artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify canonical SQL project
        run: test -f src/Crm.Analytics.Sql/Crm.Analytics.Sql.csproj

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore CrmAnalytics.slnx

      - name: Build
        run: dotnet build CrmAnalytics.slnx -c Release --no-restore

      - name: Validate migration model
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/CrmAnalytics.Infrastructure/CrmAnalytics.Infrastructure.csproj
          --startup-project src/CrmAnalytics.Api/CrmAnalytics.Api.csproj
          --context CrmAnalyticsDbContext
          --configuration Release --no-build

      - name: Generate idempotent migration artifact
        run: |
          mkdir -p artifacts/sql
          dotnet ef migrations script --idempotent \
            --project src/CrmAnalytics.Infrastructure/CrmAnalytics.Infrastructure.csproj \
            --startup-project src/CrmAnalytics.Api/CrmAnalytics.Api.csproj \
            --context CrmAnalyticsDbContext \
            --configuration Release --no-build \
            --output artifacts/sql/CrmAnalytics.Migrations.sql

      - name: Generate SQLite integration fixture
        run: >-
          dotnet run --project tools/Crm.Analytics.Sql.DevData/Crm.Analytics.Sql.DevData.csproj
          -c Release --no-build

      - name: Full solution tests, including SQL integration
        env:
          CRM_REQUIRE_SQLITE_DB: '1'
        run: >-
          dotnet test CrmAnalytics.slnx -c Release --no-build
          --logger "trx;LogFilePrefix=tests"
          --results-directory TestResults

      - name: Vulnerable package audit
        shell: pwsh
        run: |
          $projects = @(
            'src/CrmAnalytics.Api/CrmAnalytics.Api.csproj',
            'src/CrmAnalytics.Infrastructure/CrmAnalytics.Infrastructure.csproj',
            'src/CrmAnalytics.Teams/CrmAnalytics.Teams.csproj',
            'src/Crm.Analytics.Sql/Crm.Analytics.Sql.csproj'
          )
          foreach ($project in $projects) {
            dotnet list $project package --vulnerable --include-transitive
            if ($LASTEXITCODE -ne 0) { throw "Package audit failed: $project" }
          }

      - name: Build API image
        run: docker build --file src/CrmAnalytics.Api/Dockerfile --tag crm-analytics-api:${{ github.sha }} .

      - name: Build Teams image
        run: docker build --file src/CrmAnalytics.Teams/Dockerfile --tag crm-analytics-teams:${{ github.sha }} .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload migration artifact
        uses: actions/upload-artifact@v7
        with:
          name: migration-script
          path: artifacts/sql/CrmAnalytics.Migrations.sql
          if-no-files-found: error
